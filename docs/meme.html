    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var memeId = params.get('id');

        var container = document.getElementById('meme-detail');

        if (!memeId) {
            container.innerHTML =
                '<div class="empty-state">' +
                    '<div class="empty-state-icon">&#9888;</div>' +
                    '<p class="empty-state-text">' + t('meme_page.noId') + '</p>' +
                    '<a href="memes.html" class="empty-state-action">' + t('meme_page.browseAll') + '</a>' +
                '</div>';
            return;
        }

        document.title = t('pageTitle.meme');

        loadFullData().then(function (data) {
            var meme = getMemeById(data, memeId);
            if (!meme) {
                container.innerHTML =
                    '<a href="memes.html" class="meme-detail-back">' + t('meme_page.back') + '</a>' +
                    '<div class="empty-state">' +
                        '<div class="empty-state-icon">&#128269;</div>' +
                        '<p class="empty-state-text">' + t('meme_page.notFound') + ': ' + escapeHtml(memeId) + '</p>' +
                        '<a href="memes.html" class="empty-state-action">' + t('meme_page.browseAll') + '</a>' +
                    '</div>';
                return;
            }

            document.title = memeId + ' | ' + t('common.siteName');
            renderMemeDetail(meme);
        }).catch(function () {
            container.innerHTML =
                '<a href="memes.html" class="meme-detail-back">&#8592; ' + t('meme_page.back') + '</a>' +
                '<div class="empty-state">' +
                    '<div class="empty-state-icon">&#9888;</div>' +
                    '<p class="empty-state-text">' + t('common.error') + '</p>' +
                '</div>';
        });

        function renderMemeDetail(meme) {
            var aliasesHtml = '';
            if (meme.aliases && meme.aliases.length > 0) {
                aliasesHtml = '<div class="meme-detail-aliases">' + t('meme_page.aliases') + ': ' +
                    meme.aliases.map(function (a) { return '<span>' + escapeHtml(a) + '</span>'; }).join('') +
                    '</div>';
            }

            var tagsHtml = '';
            if (meme.tags && meme.tags.length > 0) {
                tagsHtml = '<div class="meme-detail-tags">' +
                    meme.tags.map(function (tag) {
                        return '<span class="meme-detail-tag">' + escapeHtml(tag) + '</span>';
                    }).join('') +
                    '</div>';
            }

            var descHtml = '';
            if (meme.description) {
                descHtml = '<p class="meme-detail-description">' + escapeHtml(meme.description) + '</p>';
            }

            var originHtml = '';
            if (meme.origin_video) {
                var safeUrl = safeHref(meme.origin_video);
                originHtml = '<div class="meme-detail-origin">' +
                    '<p style="color:var(--text-muted);margin-bottom:8px;">' + t('meme_page.originVideo') + '</p>' +
                    '<a href="' + safeUrl + '" target="_blank" rel="noopener">' + escapeHtml(meme.origin_video) + '</a>' +
                    '</div>';
            }

            var videosHtml = '';
            if (meme.videos && meme.videos.length > 0) {
                videosHtml = '<div class="meme-detail-videos">' +
                    '<h2>' + t('meme_page.videos') + ' (' + meme.videos.length + ')</h2>' +
                    '<div class="video-list">';
                meme.videos.forEach(function (video) {
                    var bvid = video.bvid || '';
                    var biliUrl = bvid ? 'https://www.bilibili.com/video/' + bvid : '#';
                    videosHtml += '<div class="video-card">' +
                        '<div class="video-card-title">' +
                            '<a href="' + biliUrl + '" target="_blank" rel="noopener">' + escapeHtml(video.title || t('common.noTitle')) + '</a>' +
                        '</div>' +
                        '<div class="video-card-author">' + t('meme_page.upMaster') + ': ' + escapeHtml(video.author || t('common.unknown')) + '</div>';
                    if (video.description) {
                        videosHtml += '<div class="video-card-desc">' + escapeHtml(video.description) + '</div>';
                    }
                    if (video.contributor) {
                        videosHtml += '<div class="video-card-contributor">' + t('meme_page.contributorLabel') + ': <a href="https://github.com/' + encodeURIComponent(video.contributor) + '" target="_blank" rel="noopener">@' + escapeHtml(video.contributor) + '</a></div>';
                    }
                    videosHtml += '</div>';
                });
                videosHtml += '</div></div>';
            }

            var ctaHtml = '<div class="meme-detail-cta">' +
                '<a href="https://github.com/Zw-awa/the-origin-of-the-meme/blob/main/CONTRIBUTING.md" class="btn-neon" target="_blank" rel="noopener">' + t('meme_page.contribute') + '</a>' +
                '</div>';

            container.innerHTML =
                '<a href="memes.html" class="meme-detail-back">&#8592; ' + t('meme_page.back') + '</a>' +
                '<div class="meme-detail-header">' +
                    '<div class="meme-detail-tier">' + buildTierBadge(meme.tier, true) + '</div>' +
                    '<h1 class="meme-detail-name">' + escapeHtml(meme.id) + '</h1>' +
                    aliasesHtml +
                    '</div>' +
                tagsHtml +
                descHtml +
                originHtml +
                videosHtml +
                ctaHtml;
        }
    })();
    </script>
    <script src="js/main.js"></script>
</body>
