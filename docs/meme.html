    <script src="js/data.js"></script>

    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var memeId = params.get('id');

        var container = document.getElementById('meme-detail');

        if (!memeId) {
            container.innerHTML =
                '<div class="empty-state">' +
                    '<div class="empty-state-icon">&#9888;</div>' +
                    '<p class="empty-state-text">未指定梗ID</p>' +
                    '<a href="memes.html" class="empty-state-action">浏览所有梗</a>' +
                '</div>';
            return;
        }

        document.title = '梗详情 | 万恶之源';

        loadFullData().then(function (data) {
            var meme = getMemeById(data, memeId);
            if (!meme) {
                container.innerHTML =
                    '<a href="memes.html" class="meme-detail-back">&#8592; 返回梗列表</a>' +
                    '<div class="empty-state">' +
                        '<div class="empty-state-icon">&#128269;</div>' +
                        '<p class="empty-state-text">未找到梗: ' + escapeHtml(memeId) + '</p>' +
                        '<a href="memes.html" class="empty-state-action">浏览所有梗</a>' +
                    '</div>';
                return;
            }

            document.title = memeId + ' | 万恶之源';
            renderMemeDetail(meme);
        }).catch(function () {
            container.innerHTML =
                '<a href="memes.html" class="meme-detail-back">&#8592; 返回梗列表</a>' +
                '<div class="empty-state">' +
                    '<div class="empty-state-icon">&#9888;</div>' +
                    '<p class="empty-state-text">数据加载失败</p>' +
                '</div>';
        });

        function renderMemeDetail(meme) {
            var aliasesHtml = '';
            if (meme.aliases && meme.aliases.length > 0) {
                aliasesHtml = '<div class="meme-detail-aliases">别名: ' +
                    meme.aliases.map(function (a) { return '<span>' + escapeHtml(a) + '</span>'; }).join('') +
                    '</div>';
            }

            var tagsHtml = '';
            if (meme.tags && meme.tags.length > 0) {
                tagsHtml = '<div class="meme-detail-tags">' +
                    meme.tags.map(function (t) {
                        return '<span class="meme-detail-tag">' + escapeHtml(t) + '</span>';
                    }).join('') +
                    '</div>';
            }

            var descHtml = '';
            if (meme.description) {
                descHtml = '<p class="meme-detail-description">' + escapeHtml(meme.description) + '</p>';
            }

            var originHtml = '';
            if (meme.origin_video) {
                originHtml = '<div class="meme-detail-origin">' +
                    '<p style="color:var(--text-muted);margin-bottom:8px;">万恶之源视频</p>' +
                    '<a href="' + escapeHtml(meme.origin_video) + '" target="_blank" rel="noopener">' + escapeHtml(meme.origin_video) + '</a>' +
                    '</div>';
            }

            var videosHtml = '';
            if (meme.videos && meme.videos.length > 0) {
                videosHtml = '<div class="meme-detail-videos">' +
                    '<h2>收录视频 (' + meme.videos.length + ')</h2>' +
                    '<div class="video-list">';
                meme.videos.forEach(function (video) {
                    var bvid = video.bvid || '';
                    var biliUrl = bvid ? 'https://www.bilibili.com/video/' + bvid : '#';
                    videosHtml += '<div class="video-card">' +
                        '<div class="video-card-title">' +
                            '<a href="' + biliUrl + '" target="_blank" rel="noopener">' + escapeHtml(video.title || '无标题') + '</a>' +
                        '</div>' +
                        '<div class="video-card-author">UP主: ' + escapeHtml(video.author || '未知') + '</div>';
                    if (video.description) {
                        videosHtml += '<div class="video-card-desc">' + escapeHtml(video.description) + '</div>';
                    }
                    if (video.contributor) {
                        videosHtml += '<div class="video-card-contributor">贡献者: <a href="https://github.com/' + escapeHtml(video.contributor) + '" target="_blank" rel="noopener">@' + escapeHtml(video.contributor) + '</a></div>';
                    }
                    videosHtml += '</div>';
                });
                videosHtml += '</div></div>';
            }

            var ctaHtml = '<div class="meme-detail-cta">' +
                '<a href="https://github.com/Zw-awa/the-origin-of-the-meme/blob/main/CONTRIBUTING.md" class="btn-neon" target="_blank" rel="noopener">贡献视频</a>' +
                '</div>';

            container.innerHTML =
                '<a href="memes.html" class="meme-detail-back">&#8592; 返回梗列表</a>' +
                '<div class="meme-detail-header">' +
                    '<div class="meme-detail-tier">' + buildTierBadge(meme.tier, true) + '</div>' +
                    '<h1 class="meme-detail-name">' + escapeHtml(meme.id) + '</h1>' +
                    aliasesHtml +
                    '</div>' +
                tagsHtml +
                descHtml +
                originHtml +
                videosHtml +
                ctaHtml;
        }
    })();
    </script>
    <script src="js/main.js"></script>
