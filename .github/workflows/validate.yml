name: Validate Meme Data

on:
  pull_request:
    paths:
      - 'memes/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate YAML files
        id: validate
        run: python scripts/validate.py
        continue-on-error: true

      - name: Generate fallback report
        if: steps.validate.outcome == 'failure'
        run: |
          echo '## ❌ 梗数据校验失败' > validation-report.md
          echo '' >> validation-report.md
          echo '校验脚本执行异常，请检查 PR 中的 YAML 文件格式。' >> validation-report.md
          echo '' >> validation-report.md
          echo '常见问题：YAML 语法错误、缩进不正确、缺少必填字段。' >> validation-report.md
          echo '详情请参考 [CONTRIBUTING.md](CONTRIBUTING.md)。' >> validation-report.md

      - name: Comment on PR
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: validation-report.md

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
