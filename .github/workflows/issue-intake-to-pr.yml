name: Convert Meme Intake Issue To Draft PR

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-intake-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  convert:
    if: contains(fromJson('["action:create-draft-pr","action:sync-from-issue"]'), github.event.label.name) && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.sender.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml==6.0.2

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              {
                name: 'action:create-draft-pr',
                color: '5319e7',
                description: '维护者添加后，根据 Issue 创建 Draft PR',
              },
              {
                name: 'action:sync-from-issue',
                color: '6f42c1',
                description: '维护者添加后，用最新 Issue 内容同步已有 Draft PR',
              },
              {
                name: 'status:draft-pr-created',
                color: '0e8a16',
                description: '已根据 Issue 自动创建或更新 Draft PR',
              },
            ];
            const { owner, repo } = context.repo;
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

      - name: Re-validate issue payload
        id: validate
        run: python scripts/validate_issue.py --event-path "$GITHUB_EVENT_PATH"
        continue-on-error: true

      - name: Abort conversion when issue is invalid
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- issue-intake-draft-pr -->';
            const body = [
              marker,
              '## ❌ Draft PR 生成已取消',
              '',
              '当前 Issue 在重新校验时没有通过，因此没有继续自动创建 Draft PR。',
              '',
              '- 请先根据最新校验评论修正 Issue 内容',
              '- 修正后等待自动校验重新通过，再由维护者重新添加 `action:create-draft-pr` 标签',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' &&
              comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: 'action:create-draft-pr',
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Stop when validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Materialize issue into repo files
        id: materialize
        run: python scripts/issue_to_pr.py --event-path "$GITHUB_EVENT_PATH"

      - name: Compute generated data
        run: python scripts/compute.py

      - name: Create or update draft PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.materialize.outputs.commit_message }}
          branch: ${{ steps.materialize.outputs.branch_name }}
          branch-suffix: never
          delete-branch: false
          base: ${{ github.event.repository.default_branch }}
          title: ${{ steps.materialize.outputs.pr_title }}
          body: |
            Closes #${{ github.event.issue.number }}

            ## 来源

            本 Draft PR 由 Issue Intake 工作流自动生成。

            - 来源 Issue: #${{ github.event.issue.number }}
            - 提交类型: ${{ steps.materialize.outputs.submission_type }}
            - 梗名称: ${{ steps.materialize.outputs.meme_name }}
            - 目标文件: `${{ steps.materialize.outputs.target_path }}`

            ## 说明

            - 当前分支内容来自 Issue 中粘贴的完整 YAML 提案
            - 已在生成前重新执行一次 Issue 自动校验
            - 已同步运行 `scripts/compute.py`，避免 PR 初始状态就缺少 `docs/_data` 更新

            如需继续修订，可直接在这个 Draft PR 上追加提交；如果想用最新 Issue 内容覆盖同步，请在原 Issue 上添加 `action:sync-from-issue` 标签。
          draft: true
          labels: |
            meme-intake

      - name: Resolve PR metadata
        id: prmeta
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.materialize.outputs.branch_name }}
          CPR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          CPR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        with:
          script: |
            const core = require('@actions/core');
            const { owner, repo } = context.repo;
            let number = process.env.CPR_NUMBER;
            let url = process.env.CPR_URL;

            if (!number || !url) {
              const pulls = await github.rest.pulls.list({
                owner,
                repo,
                state: 'all',
                head: `${owner}:${process.env.BRANCH_NAME}`,
                per_page: 10,
              });
              const pr = pulls.data[0];
              if (pr) {
                number = String(pr.number);
                url = pr.html_url;
              }
            }

            if (!number || !url) {
              core.setFailed('Unable to resolve draft PR metadata');
              return;
            }

            core.setOutput('number', number);
            core.setOutput('url', url);

      - name: Comment on issue and sync labels
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.prmeta.outputs.number }}
          PR_URL: ${{ steps.prmeta.outputs.url }}
        with:
          script: |
            const marker = '<!-- issue-intake-draft-pr -->';
            const body = [
              marker,
              '## ✅ Draft PR 已创建或更新',
              '',
              `- Draft PR: #${process.env.PR_NUMBER}`,
              `- 链接: ${process.env.PR_URL}`,
              '',
              '后续如果你继续修改这个 Issue，维护者可以重新添加 `action:create-draft-pr` 标签，将最新内容再次同步到同一条 Draft PR 分支。',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            const removable = [
              'action:create-draft-pr',
              'action:sync-from-issue',
              'status:needs-manual-review',
              'status:awaiting-author-update',
            ];
            for (const name of removable) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            const labelsToAdd = ['status:draft-pr-created'];
            const existingNames = context.payload.issue.labels.map((label) => label.name);
            const add = labelsToAdd.filter((name) => !existingNames.includes(name));
            if (add.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: add,
              });
            }
