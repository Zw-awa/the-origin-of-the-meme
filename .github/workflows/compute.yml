name: Compute Rankings

on:
  push:
    branches: [main]
    paths:
      - 'memes/**'
      - '_data/tiers.yaml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compute
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml==6.0.2

      - name: Compute rankings
        run: python scripts/compute.py

      - name: Commit computed.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update computed.json [skip ci]"
          file_pattern: "_data/computed.json _data/memes-full.json docs/_data/computed.json docs/_data/memes-full.json"
